apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-httproute-tls-redirect
  namespace: app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: app
    component: gateway-route
spec:
  parentRefs:
    - name: app-gateway
      sectionName: http
      namespace: app
  hostnames:
    - microservice-shop.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-httproute
  namespace: app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: app
    component: gateway-route
spec:
  parentRefs:
    - name: app-gateway
      sectionName: https
      namespace: app
  hostnames:
    - microservice-shop.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /products
      backendRefs:
        - name: product-service-svc
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api/orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /orders
      backendRefs:
        - name: order-service-svc
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-svc
          port: 8080
