apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: cache
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: cache
    tier: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
