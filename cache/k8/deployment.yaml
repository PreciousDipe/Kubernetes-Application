apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cache
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: cache
    tier: cache
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: cache
        tier: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999         # "redis" user in the alpine image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.3-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apps-secret
                  key: REDIS_PASSWORD
            - name: REDIS_MAXMEMORY
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_MAXMEMORY
            - name: REDIS_MAXMEMORY_POLICY
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_MAXMEMORY_POLICY
          # Kubernetes expands $(VAR) from the env above, so no value is hardcoded.
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - $(REDIS_MAXMEMORY)
            - --maxmemory-policy
            - $(REDIS_MAXMEMORY_POLICY)
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 200Mi
