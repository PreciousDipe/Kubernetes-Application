apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service-pdb
  namespace: app
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: app
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
