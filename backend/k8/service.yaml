apiVersion: v1
kind: Service
metadata:
  name: product-service-svc
  namespace: app
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: app
    tier: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-svc
  namespace: app
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: app
    tier: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 3000
      targetPort: http
