{{- if .Values.secrets.create }}
{{- /* One identical copy per namespace: Secrets can't be read across namespaces. */}}
{{- $pg := required "set secrets.postgresPassword (e.g. --set secrets.postgresPassword=...)" .Values.secrets.postgresPassword }}
{{- $redis := required "set secrets.redisPassword (e.g. --set secrets.redisPassword=...)" .Values.secrets.redisPassword }}
{{- range $key := list "app" "database" "cache" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.secrets.name }}
  namespace: {{ index $.Values.namespaces $key }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $.Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ $pg | quote }}
  REDIS_PASSWORD: {{ $redis | quote }}
{{- end }}
{{- end }}
