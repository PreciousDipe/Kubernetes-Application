apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: {{ .Values.namespaces.database }}
  labels:
    app.kubernetes.io/part-of: database
    {{- include "shop.labels" . | nindent 4 }}
data:
  PGDATABASE: {{ .Values.database.name | quote }}
  PGDATA: {{ .Values.database.pgdata | quote }}
