{{- if .Values.networkPolicy.enabled }}
# Only the Gateway's nginx pods may reach the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: {{ .Values.namespaces.app }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: app-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
{{- end }}
